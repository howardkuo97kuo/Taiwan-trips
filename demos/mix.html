<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胖寶寶台灣行・小樣 Mix 環島郵路</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
/* 小樣 Mix「環島郵路」：郵戳集的蓋章 + 環島鐵路的路線 + 泡泡地圖的大小。
   一條橘線繞台灣一圈，站的大小是地點數，去過的站蓋郵戳，清單是鐵路車票。 */
:root {
  color-scheme: light dark;
  --bg: #f3f6fb;
  --paper: #fcfdff;
  --ink: #13264b;
  --soft: #5b6c8c;
  --rule: #cdd7e8;
  --orange: #f26a1b;
  --red: #d8333a;
  --gold: #ffc24a;
  --gold-ink: #3a2a05;
  --blue: #2d63c8;
  --serif: "Noto Serif TC", "Songti TC", serif;
  --sans: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --num: "Roboto Condensed", "Arial Narrow", var(--sans);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1630; --paper: #14224a; --ink: #e8eefb; --soft: #9fb0d4; --rule: #2a3c6b; --orange: #ff8a3d; --red: #ff6b70; --blue: #7fa8ff; --gold-ink: #2a1d03; }
}
:root[data-theme="dark"] { --bg: #0b1630; --paper: #14224a; --ink: #e8eefb; --soft: #9fb0d4; --rule: #2a3c6b; --orange: #ff8a3d; --red: #ff6b70; --blue: #7fa8ff; --gold-ink: #2a1d03; }

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.65 var(--sans); overflow-x: hidden; }
button, input { font: inherit; color: inherit; cursor: pointer; }
input { cursor: text; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1260px; margin: 0 auto; padding: 0 28px; }

.air { height: 14px; background: repeating-linear-gradient(-45deg, var(--red) 0 18px, var(--paper) 18px 30px, var(--blue) 30px 48px, var(--paper) 48px 60px); }
header.top { display: flex; flex-wrap: wrap; gap: 10px 30px; align-items: center; justify-content: space-between; padding: 18px 0 0; }
h1 { margin: 0; font: 900 clamp(28px, 3.6vw, 42px)/1.2 var(--serif); letter-spacing: .08em; }
.tools { display: flex; gap: 10px; align-items: center; }
.who { display: flex; gap: 8px; }
.who button { border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 5px 20px; font: 700 17px var(--serif); transition: background .25s, color .25s; }
.who button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.theme { border: 1px solid var(--rule); background: transparent; border-radius: 99px; padding: 5px 14px; font-size: 14px; color: var(--soft); }

/* 首屏：環島郵路 */
.hero { display: grid; grid-template-columns: minmax(230px, 1fr) auto minmax(230px, 1fr); gap: 20px 30px; align-items: center; min-height: min(86vh, 780px); padding: 8px 0 20px; position: relative; }
.panel { display: grid; gap: 14px; }
.panel.right { justify-items: end; text-align: right; }
.postmark { width: clamp(150px, 15vw, 200px); color: var(--red); transform: rotate(-9deg); }
.postmark text { font-family: var(--serif); font-weight: 900; fill: currentColor; }
.postmark.slam { animation: slam .55s cubic-bezier(.2, 1.4, .4, 1) both; }
.postmark .n { transform-box: fill-box; transform-origin: center; }
.postmark.bump .n { animation: bump .5s cubic-bezier(.2, 1.8, .4, 1); }
.facts { margin: 0; color: var(--soft); font-size: 15px; line-height: 1.7; }
.facts b { color: var(--ink); font-weight: 700; }
.facts strong { font: 900 24px/1.3 var(--serif); color: var(--ink); display: block; }
.pairbox { background: var(--gold); color: var(--gold-ink); border-radius: 10px; padding: 12px 18px 14px; text-align: right; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.pairbox b { font: 700 58px/1 var(--num); display: block; }
.pairbox span { font-weight: 700; }
.pairbox button { margin-top: 8px; border: 2px solid var(--gold-ink); background: transparent; color: var(--gold-ink); border-radius: 99px; padding: 1px 16px; font-weight: 700; }
.pairbox button:hover { background: var(--gold-ink); color: var(--gold); }
.legend { list-style: none; margin: 0; padding: 0; font-size: 13.5px; color: var(--soft); display: grid; gap: 4px; }
.legend i { display: inline-block; vertical-align: -3px; margin-left: 8px; }
.lg-b { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
.lg-s { width: 16px; height: 16px; border-radius: 50%; border: 2px double var(--red); background: color-mix(in srgb, var(--red) 12%, var(--paper)); }
.lg-g { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); }
.lg-l { width: 22px; height: 0; border-top: 5px solid var(--orange); vertical-align: 3px !important; }
.lg-d { width: 22px; height: 0; border-top: 3px dashed var(--soft); vertical-align: 3px !important; }

.mapbox { position: relative; }
.mapbox svg { height: min(78vh, 740px); width: auto; max-width: 100%; display: block; overflow: visible; }
.land path { fill: color-mix(in srgb, var(--ink) 7%, var(--bg)); stroke: var(--soft); stroke-width: 1.6; stroke-dasharray: 5 4; stroke-linejoin: round; }
.seg { fill: none; stroke-linecap: round; }
.seg.off { stroke: var(--soft); stroke-width: 2.5; stroke-dasharray: 2 7; opacity: .7; }
.seg.half { stroke: var(--orange); stroke-width: 3; stroke-dasharray: 9 7; opacity: .75; }
.seg.on { stroke: var(--orange); stroke-width: 7; }
.seg.br { stroke: var(--blue); stroke-width: 2.5; stroke-dasharray: 1 6; opacity: .8; }
.lead line { stroke: var(--soft); stroke-width: 1.2; stroke-dasharray: 3 3; }
.lead circle { fill: var(--ink); }
.stn { cursor: pointer; }
.stn .body { fill: var(--paper); stroke: var(--ink); stroke-width: 3; transition: fill .25s, stroke .25s; }
.stn:hover .body, .stn:focus-visible .body { stroke: var(--orange); }
.stn.sel .body { stroke: var(--orange); stroke-width: 6; }
.stn.lit .body { fill: color-mix(in srgb, var(--red) 14%, var(--paper)); stroke: var(--red); }
.stn .ring { fill: none; stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 2 3; opacity: 0; transition: opacity .3s; }
.stn.lit .ring { opacity: 1; }
.stn text { font: 700 13px var(--serif); fill: var(--ink); text-anchor: middle; pointer-events: none; }
.stn text.n { font: 700 17px var(--num); }
.stn .tag { fill: var(--gold); }
.stn text.tg { font: 700 12px var(--num); fill: var(--gold-ink); }
.stn.dim { opacity: .35; }
.dot0 { fill: var(--paper); stroke: var(--soft); stroke-width: 2; }
.mapbox.compact .stn text { display: none; }
.mapbox.compact .stn .body { stroke-width: 6; }
.mapbox.compact .seg.on { stroke-width: 11; } .mapbox.compact .seg.off { stroke-width: 4; } .mapbox.compact .seg.half { stroke-width: 5; }
.mapbox.compact .stn .tag, .mapbox.compact .stn text.tg { display: none; }

/* 動作 */
@keyframes slam { 0% { transform: rotate(-30deg) scale(2.6); opacity: 0; } 55% { transform: rotate(-6deg) scale(.94); opacity: 1; } 100% { transform: rotate(-9deg) scale(1); } }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pulse { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(2.6); opacity: 0; } }
@keyframes stampin { 0% { transform: scale(1.9) rotate(-18deg); } 60% { transform: scale(.92); } 100% { transform: none; } }
.intro .seg.on { stroke-dasharray: 1; animation: draw .5s ease-out both; animation-delay: calc(var(--i) * 90ms); }
.intro .seg.half, .intro .seg.off, .intro .seg.br { animation: fade .5s ease-out both; animation-delay: calc(var(--i) * 90ms); }
.intro .stn { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1) both; animation-delay: calc(var(--i) * 90ms + 120ms); transform-box: fill-box; transform-origin: center; }
.lay { stroke-dasharray: 1 !important; animation: draw .7s ease-out both; }
.stn.new .body, .stn.new .ring { transform-box: fill-box; transform-origin: center; animation: stampin .55s cubic-bezier(.2, 1.4, .4, 1); }
.stn.new .pulse { animation: pulse .9s ease-out; }
.pulse { fill: none; stroke: var(--red); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
.train { fill: var(--gold); stroke: var(--ink); stroke-width: 3; }
.finale-stamp { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) rotate(-10deg); font: 900 clamp(44px, 7vw, 90px)/1 var(--serif); color: var(--red); border: 8px double var(--red); padding: 6px 28px; border-radius: 10px; background: color-mix(in srgb, var(--paper) 88%, transparent); letter-spacing: .1em; pointer-events: none; animation: slam .7s cubic-bezier(.2, 1.4, .4, 1) .6s both; white-space: nowrap; }

/* 浮動小地圖 */
.dock { position: fixed; right: max(20px, calc((100vw - 1260px) / 2 + 20px)); top: 88px; width: 270px; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; padding: 12px 14px 14px; box-shadow: 0 10px 30px -12px #0008; opacity: 0; transform: translateY(12px) scale(.96); pointer-events: none; transition: opacity .35s, transform .35s; z-index: 5; display: none; }
.dock.show { opacity: 1; transform: none; pointer-events: auto; }
.dock h2 { margin: 0; font: 900 17px/1.3 var(--serif); display: flex; justify-content: space-between; align-items: baseline; }
.dock h2 small { font: 500 13px var(--sans); color: var(--soft); }
.dock .mapbox svg { height: 300px; margin: 6px auto 0; }
.dock button.top { margin-top: 6px; width: 100%; border: 2px solid var(--ink); background: transparent; border-radius: 99px; padding: 1px 0; font-weight: 700; font-size: 14px; }

/* 時刻表與車票 */
.board { display: block; padding-bottom: 80px; }
.sechead { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: baseline; justify-content: space-between; border-bottom: 3px solid var(--ink); padding-bottom: 8px; scroll-margin-top: 14px; }
.sechead h2 { margin: 0; font: 900 28px/1.3 var(--serif); }
.sechead h2 button { border: 0; background: none; font: 500 14px var(--sans); color: var(--blue); text-decoration: underline; margin-left: 10px; padding: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 3px 14px; font-weight: 500; transition: background .2s, color .2s; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.tabs small { font: 700 13px var(--num); margin-left: 5px; opacity: .8; }
.tabs button.gold[aria-pressed="true"] { background: var(--gold); color: var(--gold-ink); border-color: var(--gold-ink); }
.filt { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; margin: 14px 0 20px; }
.cats { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0; padding: 0; list-style: none; flex: 1; }
.cats button { border: 0; background: none; padding: 0 0 2px; color: var(--soft); border-bottom: 3px solid transparent; }
.cats button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-color: var(--orange); }
.search { border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 5px 12px; width: 230px; }

.list { max-width: 860px; }
.tk { position: relative; display: grid; grid-template-columns: 84px minmax(0, 1fr) auto auto; background: var(--paper); border: 2px solid var(--ink); border-radius: 10px; margin: 0 0 16px; }
.tk::before, .tk::after { content: ""; position: absolute; left: 73px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); border: 2px solid var(--ink); }
.tk::before { top: -12px; clip-path: inset(50% 0 0 0); }
.tk::after { bottom: -12px; clip-path: inset(0 0 50% 0); }
.tk.pair { border-color: var(--gold-ink); box-shadow: 0 0 0 3px var(--gold); }
:root[data-theme="dark"] .tk.pair { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); }
.stub { border-right: 2px dashed var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; text-align: center; }
.stub .c { font: 900 16px/1.2 var(--serif); }
.stub .z { font: 700 12px var(--num); color: var(--soft); letter-spacing: .06em; }
.mid { padding: 12px 16px; min-width: 0; }
.mid h3 { margin: 0; font: 700 18px/1.4 var(--serif); }
.mid h3 a { color: inherit; text-decoration: none; } .mid h3 a:hover { text-decoration: underline; text-decoration-color: var(--orange); }
.mid .meta { color: var(--soft); font-size: 14px; line-height: 1.5; }
.mid .note { margin: 4px 0 0; font-size: 13.5px; color: var(--soft); }
.mid .ghost { margin-top: 6px; font-size: 13px; color: var(--soft); }
.mid .ghost b { color: var(--orange); font-weight: 700; }
.pairtab { position: absolute; top: -13px; right: 22px; background: var(--gold); color: var(--gold-ink); font: 900 13px/1.6 var(--serif); padding: 0 12px; border-radius: 4px; }
.pairtab.fresh { animation: tab .5s cubic-bezier(.2, 1.4, .4, 1); }
@keyframes tab { from { transform: translateY(14px); opacity: 0; } }
.want { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; padding: 8px 14px; }
.want .row { display: flex; gap: 10px; }
.wb { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--soft); }
.wb button, .wb .d { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); padding: 0; display: block; transition: background .2s, transform .2s; }
.wb .d { border-color: var(--rule); }
.wb button:hover { transform: scale(1.1); }
.wb .on { background: var(--orange); border-color: var(--ink); }
.wb .d.on { background: var(--soft); border-color: var(--soft); }
.stampzone { width: 118px; display: grid; place-items: center; padding: 8px 12px 8px 4px; border-left: 2px dashed var(--rule); }
.stampzone .btn { width: 82px; height: 82px; border-radius: 50%; border: 2.5px dashed var(--soft); background: transparent; color: var(--soft); font: 700 15px var(--serif); display: grid; place-items: center; padding: 0; transition: border-color .2s, color .2s; }
.stampzone .btn:hover { border-color: var(--red); color: var(--red); }
.stamp { width: 86px; height: 86px; color: var(--red); background: none; border: 0; padding: 0; transform: rotate(-9deg); }
.stamp svg { width: 100%; height: 100%; overflow: visible; }
.stamp text { font-family: var(--serif); font-weight: 900; fill: currentColor; }
.stamp.slam { animation: slam .5s cubic-bezier(.2, 1.4, .4, 1) both; }
.stamp.slam::after { content: ""; position: absolute; inset: 0; }
.again { grid-column: 1 / -1; border: 0; background: none; font-size: 12.5px; color: var(--soft); padding: 0; text-decoration: underline; margin-top: -2px; }
.again[aria-pressed="true"] { color: var(--orange); font-weight: 700; }
.again:disabled { display: none; }
.more { display: block; margin: 8px 0 0; border: 2px solid var(--ink); background: var(--paper); border-radius: 4px; padding: 7px 26px; font-weight: 700; }
.empty { padding: 36px 10px; text-align: center; color: var(--soft); font: 500 18px var(--serif); border: 2px dashed var(--rule); border-radius: 10px; }
.foot { margin-top: 32px; color: var(--soft); font-size: 13px; }
.foot button { border: 0; background: none; text-decoration: underline; color: inherit; padding: 0; }

@media (min-width: 1180px) {
  .dock { display: block; }
  .board .list, .board .sechead, .board .filt { margin-right: 310px; max-width: none; }
  .board .list { max-width: 860px; }
}
@media (max-width: 1000px) {
  .hero { grid-template-columns: minmax(0, 1fr); min-height: 0; justify-items: center; padding-top: 18px; }
  .panel, .panel.right { justify-items: center; text-align: center; }
  .panel.left { grid-template-columns: auto 1fr; align-items: center; gap: 18px; text-align: left; justify-items: start; }
  .mapbox svg { height: min(58vh, 520px); }
  .pairbox { text-align: center; }
  .legend { justify-items: center; }
}
@media (max-width: 640px) {
  .wrap { padding: 0 14px; }
  .tk { grid-template-columns: 62px minmax(0, 1fr); }
  .tk::before, .tk::after { left: 51px; }
  .want { grid-column: 1 / -1; flex-direction: row; justify-content: space-between; border-top: 2px dashed var(--rule); padding: 8px 14px; }
  .stampzone { width: auto; grid-column: 1 / -1; border-left: 0; border-top: 2px dashed var(--rule); padding: 8px; }
  .stamp, .stampzone .btn { width: 70px; height: 70px; }
  .search { width: 100%; }
  .panel.left { grid-template-columns: 1fr; justify-items: center; text-align: center; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>
</head>
<body>
<div class="air" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <h1>胖寶寶台灣行</h1>
    <div class="tools"><span class="who" id="who" role="group" aria-label="我是誰"></span><button class="theme" id="theme" type="button"></button></div>
  </header>

  <section class="hero" id="hero" aria-label="環島郵路">
    <div class="panel left" id="pl"></div>
    <div class="mapbox" id="map"></div>
    <div class="panel right" id="pr"></div>
    <div class="finale-stamp" id="finale" hidden>環島完成</div>
  </section>

  <section class="board">
    <div class="sechead" id="sec">
      <h2 id="st"></h2>
      <div class="tabs" id="mode" role="group" aria-label="想去的對照"></div>
    </div>
    <div class="filt"><ul class="cats" id="cats"></ul><input class="search" id="q" type="search" placeholder="找店名或地址" aria-label="找店名或地址"></div>
    <div class="list" id="list"></div>
    <div class="list"><button class="more" id="more" type="button" hidden></button></div>
    <p class="foot">設計小樣：地點來自 <code>data/places.json</code>，想去與蓋章是示意資料，只存在這個瀏覽器；台灣輪廓是手描的近似圖，不是官方邊界。「去過」只記年月（YYYY-MM）。<button id="reset" type="button">重設示意標記</button>　<button id="fin" type="button">預覽集滿 22 站的動畫</button></p>
  </section>
</div>

<aside class="dock" id="dock" aria-label="小地圖">
  <h2>環島郵路 <small id="dn"></small></h2>
  <div class="mapbox compact" id="dmap"></div>
  <button class="top" type="button" data-act="top">回到大地圖</button>
</aside>

<script>const DEMO = 'mix';</script>
<script>/* 小樣共用核心：資料、示意標記、篩選、統計。來自 data/places.json 與 data/regions.json（建置時內嵌）。

    return m;
  }

  let st = { who: 'apong', theme: null, marks: null };
  try { st = { ...st, ...JSON.parse(localStorage.getItem(KEY) || '{}') }; } catch (e) { /* 無痕模式等情況：照預設 */ }
  if (!st.marks) st.marks = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { /* 存不下就算了 */ } };

  const listeners = [];
  const emit = () => listeners.forEach(f => f());

  const filter = { cat: 'all', mode: 'all', county: null, q: '' };

  const mk = (who, id) => st.marks[who][id] || {};
  const other = who => (who === 'apong' ? 'baobao' : 'apong');
  const wantBoth = id => !!(mk('apong', id).want && mk('baobao', id).want);
  const wantOne = id => !!(mk('apong', id).want) !== !!(mk('baobao', id).want);
  const beenAny = id => !!(mk('apong', id).been || mk('baobao', id).been);

  function matches(p) {
    if (p.status && p.status !== 'open') return false;
    if (filter.cat !== 'all' && p.c !== filter.cat && p.c2 !== filter.cat) return false;
    if (filter.county && p.county !== filter.county) return false;
    if (filter.q && !(p.n + p.a).includes(filter.q)) return false;
    if (filter.mode === 'both' && !wantBoth(p.id)) return false;
    if (filter.mode === 'one' && !wantOne(p.id)) return false;
    if (filter.mode === 'been' && !beenAny(p.id)) return false;
    return true;
  }

  function visible() {
    return places.filter(matches).sort((a, b) =>
      (wantBoth(b.id) - wantBoth(a.id)) || (wantOne(b.id) - wantOne(a.id)) || a.n.localeCompare(b.n, 'zh-Hant'));
  }

  function countyStats() {
    const s = {};
    for (const c of counties) s[c.id] = { total: 0, both: 0, been: 0, beenBy: { apong: 0, baobao: 0 } };
    for (const p of places) {
      if (p.status && p.status !== 'open') continue;
      const x = s[p.county]; x.total++;
      if (wantBoth(p.id)) x.both++;
      if (beenAny(p.id)) x.been++;
      for (const w of ['apong', 'baobao']) if (mk(w, p.id).been) x.beenBy[w]++;
    }
    return s;
  }

  const lit = (stats = countyStats()) => counties.filter(c => stats[c.id].been > 0).length;

  /* 簡化的台灣輪廓（[緯度, 經度]，約略描形，只用來襯底，不是官方邊界；正式版改用 data/geo/ 的縣市邊界） */
  const GEO = {
    main: [[25.30, 121.54], [25.27, 121.70], [25.15, 121.78], [25.13, 121.93], [25.00, 122.00], [24.85, 121.92], [24.60, 121.87], [24.30, 121.72], [24.00, 121.62], [23.60, 121.52], [23.20, 121.42], [22.90, 121.25], [22.60, 121.02], [22.35, 120.88], [22.10, 120.85], [21.91, 120.85], [21.93, 120.75], [22.05, 120.70], [22.30, 120.62], [22.45, 120.58], [22.62, 120.27], [22.95, 120.15], [23.30, 120.08], [23.65, 120.12], [23.95, 120.25], [24.20, 120.45], [24.45, 120.60], [24.70, 120.85], [24.88, 120.97], [25.05, 121.22], [25.15, 121.40], [25.25, 121.48]],
    islands: {
      penghu: [[23.72, 119.50], [23.72, 119.68], [23.55, 119.69], [23.44, 119.56], [23.56, 119.45]],
      kinmen: [[24.52, 118.20], [24.52, 118.50], [24.41, 118.50], [24.40, 118.30]],
      lienchiang: [[26.22, 119.92], [26.22, 120.02], [26.12, 120.02], [26.12, 119.92]],
    },
  };

  const api = {
    geo: GEO,
    DATA, WHO, counties, byCounty, places, cats, filter, mk, other, wantBoth, wantOne, beenAny,
    visible, countyStats, lit, NOW,
    ym: id => { const a = mk('apong', id).ym, b = mk('baobao', id).ym; return [a, b].filter(Boolean).sort().pop() || ''; },
    get who() { return st.who; },
    whoName: id => WHO.find(w => w.id === id).name,
    setWho(id) { st.who = id; save(); emit(); },
    toggle(id, key) {
      const cur = { ...mk(st.who, id) };
      cur[key] = !cur[key];
      if (key === 'been' && !cur.been) { delete cur.again; delete cur.ym; }
      if (key === 'again' && cur.again) cur.been = true;
      if (cur.been && !cur.ym) cur.ym = NOW;
      for (const k of Object.keys(cur)) if (!cur[k]) delete cur[k];
      st.marks[st.who][id] = cur;
      save(); emit();
    },
    set(k, v) { filter[k] = v; emit(); },
    resetMarks() { st.marks = seed(); save(); emit(); },
    onChange(f) { listeners.push(f); },
    gurl: p => 'https://www.google.com/maps/place/?q=place_id:' + p.pid,
    esc: s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])),
    theme: {
      init() {
        const t = st.theme;
        if (t) document.documentElement.dataset.theme = t;
      },
      toggle() {
        const dark = document.documentElement.dataset.theme
          ? document.documentElement.dataset.theme === 'dark'
          : matchMedia('(prefers-color-scheme: dark)').matches;
        st.theme = dark ? 'light' : 'dark';
        document.documentElement.dataset.theme = st.theme;
        save(); emit();
      },
      isDark: () => (document.documentElement.dataset.theme
        ? document.documentElement.dataset.theme === 'dark'
        : matchMedia('(prefers-color-scheme: dark)').matches),
    },
  };
  api.theme.init();
  return api;
})();
</script>
<script>
const $ = id => document.getElementById(id);
const LOOP = ['north-taipei', 'north-taoyuan', 'north-hsinchu-city', 'north-hsinchu-county', 'central-miaoli', 'central-taichung', 'central-changhua', 'central-yunlin', 'south-chiayi-county', 'south-chiayi-city', 'south-tainan', 'south-kaohsiung', 'south-pingtung', 'east-taitung', 'east-hualien', 'east-yilan', 'north-keelung', 'north-newtaipei'];
const BRANCH = [['central-nantou', 'central-taichung']];
const MODES = [['all', '全部車次'], ['both', '雙人票'], ['one', '一人想去'], ['been', '已蓋章']];
const sx = lng => (lng - 117.9) * 128, sy = lat => (26.45 - lat) * 128;
const KINMEN = [182, 270];
const VB = '150 10 420 600';
let shown = 40, slamKey = null, freshPair = null, fx = { intro: true }, prevLit = null, prevCount = null, prevOn = null, prevPair = new Set(), finale = false;

/* 站點位置：真位置 + 互相擠開的泡泡位置 */
let layout = null;
function stations() {
  if (layout) return layout;
  const st = TW.countyStats();
  const nodes = TW.counties.map(c => {
    let tx = sx(c.center[1]), ty = sy(c.center[0]);
    if (c.id === 'island-kinmen') [tx, ty] = KINMEN;
    const total = st[c.id].total;
    return { c, tx, ty, x: tx, y: ty, total, r: total ? Math.min(34, 13 + Math.sqrt(total) * 1.9) : 5 };
  });
  const live = nodes.filter(n => n.total);
  for (let k = 0; k < 100; k++) for (let i = 0; i < live.length; i++) for (let j = i + 1; j < live.length; j++) {
    const a = live[i], b = live[j]; let dx = b.x - a.x, dy = b.y - a.y; const d = Math.hypot(dx, dy) || .01, min = a.r + b.r + 5;
    if (d < min) { const m = (min - d) / 2; dx /= d; dy /= d; a.x -= dx * m; a.y -= dy * m; b.x += dx * m; b.y += dy * m; }
  }
  return (layout = Object.fromEntries(nodes.map(n => [n.c.id, n])));
}

const poly = pts => pts.map(([la, lo], i) => (i ? 'L' : 'M') + sx(lo).toFixed(1) + ' ' + sy(la).toFixed(1)).join(' ') + 'Z';
const ym = s => (s ? s.replace('-', '·') : '');

function mapSVG(st, litSet, opts = {}) {
  const f = TW.filter, S = stations(), compact = !!opts.compact;
  const segs = LOOP.map((id, i) => [id, LOOP[(i + 1) % LOOP.length], i]);
  const segHTML = segs.map(([a, b, i]) => {
    const la = litSet.has(a), lb = litSet.has(b), cls = la && lb ? 'on' : la || lb ? 'half' : 'off';
    const key = a + '|' + b, lay = cls === 'on' && prevOn && !prevOn.has(key) && !fx.intro;
    return `<line class="seg ${cls}${lay ? ' lay' : ''}" pathLength="1" style="--i:${i}" x1="${S[a].tx.toFixed(1)}" y1="${S[a].ty.toFixed(1)}" x2="${S[b].tx.toFixed(1)}" y2="${S[b].ty.toFixed(1)}" data-key="${key}"/>`;
  }).join('') + BRANCH.map(([a, b]) => `<line class="seg br" x1="${S[a].tx.toFixed(1)}" y1="${S[a].ty.toFixed(1)}" x2="${S[b].tx.toFixed(1)}" y2="${S[b].ty.toFixed(1)}"/>`).join('');
  const nodes = Object.values(S);
  const leads = nodes.filter(n => n.total && Math.hypot(n.x - n.tx, n.y - n.ty) > 7).map(n => `<line x1="${n.tx.toFixed(1)}" y1="${n.ty.toFixed(1)}" x2="${n.x.toFixed(1)}" y2="${n.y.toFixed(1)}"/><circle cx="${n.tx.toFixed(1)}" cy="${n.ty.toFixed(1)}" r="2.5"/>`).join('');
  const order = id => Math.max(0, LOOP.indexOf(id));
  const stns = nodes.map(n => {
    const s = st[n.c.id], lit = litSet.has(n.c.id), isNew = fx.newLit && fx.newLit.has(n.c.id);
    if (!n.total) return `<g class="stn zero" style="--i:${order(n.c.id)}"><title>${n.c.n}（尚無地點）</title><circle class="dot0" cx="${n.tx.toFixed(1)}" cy="${n.ty.toFixed(1)}" r="5"/></g>`;
    const r = compact ? Math.max(8, n.r * .55) : n.r;
    const label = compact ? '' : (n.r > 19
      ? `<text y="-2" class="n">${s.total}</text><text y="14">${n.c.n.replace(/[縣市]$/, '')}</text>`
      : `<text y="5" class="n">${s.total}</text><text y="${n.r + 16}">${n.c.n.replace(/[縣市]$/, '')}</text>`);
    const tag = s.both ? `<g class="tg"><circle class="tag" cx="${(n.r * .72).toFixed(1)}" cy="${(-n.r * .72).toFixed(1)}" r="10"/><text class="tg" x="${(n.r * .72).toFixed(1)}" y="${(-n.r * .72 + 4).toFixed(1)}">${s.both}</text></g>` : '';
    const dim = f.county && f.county !== n.c.id ? ' dim' : '';
    return `<g class="stn${lit ? ' lit' : ''}${f.county === n.c.id ? ' sel' : ''}${dim}${isNew ? ' new' : ''}" style="--i:${order(n.c.id)}" tabindex="0" role="button" data-act="county" data-v="${n.c.id}" aria-label="${n.c.n}，${s.total} 個地點${lit ? '，已蓋郵戳' : ''}${s.both ? `，${s.both} 個雙人票` : ''}" transform="translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})">
      <circle class="pulse" r="${r}"/><circle class="body" r="${r}"/><circle class="ring" r="${(r - 6).toFixed(1)}"/>${label}${tag}</g>`;
  }).join('');
  const train = opts.train ? `<circle class="train" r="9"><animateMotion dur="5.5s" repeatCount="2" path="M ${LOOP.concat(LOOP[0]).map(id => S[id].tx.toFixed(1) + ' ' + S[id].ty.toFixed(1)).join(' L ')}"/></circle>` : '';
  return `<svg viewBox="${VB}" role="group" aria-label="環島郵路：各縣市地點數與蓋章" class="${fx.intro && !compact ? 'intro' : ''}">
    <g class="land" aria-hidden="true"><path d="${poly(TW.geo.main)}"/>${['penghu', 'lienchiang'].map(k => `<path d="${poly(TW.geo.islands[k])}"/>`).join('')}<path d="M${KINMEN[0] - 18} ${KINMEN[1] - 8}h36v14h-36z"/></g>
    <g class="lead" aria-hidden="true">${leads}</g>${segHTML}${stns}${train}</svg>`;
}

function postmark(n, cls) {
  return `<svg class="postmark ${cls}" viewBox="0 0 112 112" role="img" aria-label="已蓋 ${n} 個縣市，共 22 個">
    <circle cx="56" cy="56" r="52" fill="none" stroke="currentColor" stroke-width="3"/>
    <circle cx="56" cy="56" r="44" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text class="n" x="56" y="63" text-anchor="middle" font-size="34">${n}/22</text>
    <text x="56" y="83" text-anchor="middle" font-size="12">已蓋郵戳</text></svg>`;
}

function stampSVG(txt) {
  return `<svg viewBox="0 0 90 90" aria-hidden="true"><circle cx="45" cy="45" r="41" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="45" cy="45" r="34" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 3"/><text x="45" y="44" text-anchor="middle" font-size="22">去過</text><text x="45" y="62" text-anchor="middle" font-size="12" style="font-family:var(--num);font-weight:700">${txt || ''}</text></svg>`;
}

function render() {
  const f = TW.filter, who = TW.who, other = TW.other(who), st = TW.countyStats();
  const real = new Set(TW.counties.filter(c => st[c.id].been > 0).map(c => c.id));
  const litSet = finale ? new Set(TW.counties.map(c => c.id)) : real;
  const lit = real.size;

  // 新點亮、新鋪好的段
  fx.newLit = prevLit ? new Set([...real].filter(id => !prevLit.has(id))) : new Set();
  const countChanged = prevCount !== null && prevCount !== lit;

  $('who').innerHTML = TW.WHO.map(w => `<button type="button" data-act="who" data-v="${w.id}" aria-pressed="${w.id === who}">${w.name}</button>`).join('');
  $('theme').textContent = TW.theme.isDark() ? '切換淺色' : '切換深色';
  document.documentElement.style.setProperty('--me', who === 'apong' ? 'var(--orange)' : 'var(--blue)');

  const filled = TW.counties.filter(c => st[c.id].total).length;
  const both = TW.places.filter(p => TW.wantBoth(p.id) && (!p.status || p.status === 'open')).length;
  const by = id => TW.counties.filter(c => st[c.id].beenBy[id]).length;
  $('pl').innerHTML = postmark(finale ? 22 : lit, (fx.intro ? 'slam ' : '') + (countChanged ? 'bump' : '')) +
    `<p class="facts"><strong>${TW.whoName(who)}，今天往哪站走？</strong>阿胖蓋了 <b>${by('apong')}</b> 站、寶寶 <b>${by('baobao')}</b> 站。<br>${TW.places.length} 個地點，分在 ${filled} 個縣市；還有 ${22 - filled} 個縣市等地點進來。</p>`;
  $('pr').innerHTML = `<div class="pairbox"><b>${both}</b><span>張雙人票：兩個人都想去</span><br><button type="button" data-act="mode" data-v="both">看雙人票</button></div>
    <ul class="legend"><li>泡泡越大，地點越多<i class="lg-b"></i></li><li>紅雙圈：有人蓋過郵戳<i class="lg-s"></i></li><li>金色小牌：雙人票數<i class="lg-g"></i></li><li>橘色實線：兩站都蓋過，鐵軌鋪好了<i class="lg-l"></i></li><li>虛線：還沒鋪完<i class="lg-d"></i></li></ul>`;

  $('map').innerHTML = mapSVG(st, litSet, { train: finale });
  $('dmap').innerHTML = mapSVG(st, litSet, { compact: true });
  $('dn').textContent = `${lit}/22`;
  $('finale').hidden = !finale;

  // 車票
  const keep = f.mode, counts = {};
  for (const [m] of MODES) { f.mode = m; counts[m] = TW.visible().length; }
  f.mode = keep;
  $('st').innerHTML = `${f.county ? TW.byCounty[f.county].n : '全台灣'}　時刻表${f.county ? '<button type="button" data-act="county" data-v="">看全台灣</button>' : ''}`;
  $('mode').innerHTML = MODES.map(([m, n]) => `<button type="button" class="${m === 'both' ? 'gold' : ''}" data-act="mode" data-v="${m}" aria-pressed="${f.mode === m}">${n}<small>${counts[m]}</small></button>`).join('');
  $('cats').innerHTML = ['all', ...TW.cats].map(c => `<li><button type="button" data-act="cat" data-v="${c}" aria-pressed="${f.cat === c}">${c === 'all' ? '全部車種' : c}</button></li>`).join('');

  const list = TW.visible();
  const nowPair = new Set();
  const html = list.slice(0, shown).map(p => {
    const me = TW.mk(who, p.id), ot = TW.mk(other, p.id), cn = TW.byCounty[p.county].n, pair = TW.wantBoth(p.id);
    if (pair) nowPair.add(p.id);
    const fresh = pair && freshPair === p.id;
    const stampTxt = ym(me.ym);
    const otherLine = `${TW.whoName(other)}${ot.want ? ' <b>想去</b>' : ''}${ot.been ? ` <b>去過 ${ot.ym || ''}</b>` : ''}${!ot.want && !ot.been ? ' －' : ''}`;
    return `<article class="tk${pair ? ' pair' : ''}" data-pid="${p.id}">
      ${pair ? `<span class="pairtab${fresh ? ' fresh' : ''}">雙人票</span>` : ''}
      <div class="stub"><span class="c">${TW.esc(p.c)}</span><span class="z">${TW.esc(cn.replace(/[縣市]$/, ''))}</span></div>
      <div class="mid"><h3><a href="${TW.gurl(p)}" target="_blank" rel="noopener">${TW.esc(p.n)}</a></h3>
        <div class="meta">${TW.esc(cn)} ${TW.esc(p.a.replace(cn, ''))}</div>
        ${p.note ? `<p class="note">${TW.esc(p.note.replace(/https?:\/\/\S+/g, '').trim())}</p>` : ''}
        <div class="ghost">${otherLine}</div></div>
      <div class="want"><div class="row">
        <span class="wb"><button type="button" class="${me.want ? 'on' : ''}" data-act="mark" data-id="${p.id}" data-k="want" aria-pressed="${!!me.want}" aria-label="${TW.whoName(who)}想去：${TW.esc(p.n)}"></button>${TW.whoName(who)}</span>
        <span class="wb"><span class="d${ot.want ? ' on' : ''}" role="img" aria-label="${TW.whoName(other)}${ot.want ? '想去' : '沒有標想去'}"></span>${TW.whoName(other)}</span></div>想去</div>
      <div class="stampzone">${me.been
        ? `<button type="button" class="stamp${slamKey === p.id ? ' slam' : ''}" data-act="mark" data-id="${p.id}" data-k="been" aria-pressed="true" aria-label="取消去過：${TW.esc(p.n)}">${stampSVG(stampTxt)}</button>`
        : `<button type="button" class="btn" data-act="mark" data-id="${p.id}" data-k="been" aria-pressed="false" aria-label="蓋章去過：${TW.esc(p.n)}">蓋章</button>`}
      </div>
      ${me.been ? `<button type="button" class="again" data-act="mark" data-id="${p.id}" data-k="again" aria-pressed="${!!me.again}">${me.again ? '已標：想再去' : '標成想再去'}</button>` : ''}
    </article>`;
  }).join('');
  $('list').innerHTML = html || `<div class="empty">${f.mode === 'both' ? '還沒有兩人都想去的車次，先各自多標幾間吧。' : '這一站還沒有車次。'}</div>`;
  $('more').hidden = list.length <= shown;
  $('more').textContent = `再看 ${Math.min(40, list.length - shown)} 班`;

  prevLit = real; prevCount = lit; prevPair = nowPair;
  prevOn = new Set(LOOP.map((id, i) => [id, LOOP[(i + 1) % LOOP.length]]).filter(([a, b]) => litSet.has(a) && litSet.has(b)).map(([a, b]) => a + '|' + b));
  fx = {}; slamKey = null; freshPair = null;
}

function runFinale() {
  finale = true; render();
  setTimeout(() => { finale = false; render(); }, 12500);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const v = b.dataset.v;
  switch (b.dataset.act) {
    case 'who': TW.setWho(v); break;
    case 'county': shown = 40; TW.set('county', TW.filter.county === v ? null : (v || null)); if (TW.filter.county) $('sec').scrollIntoView({ behavior: 'smooth' }); break;
    case 'mode': shown = 40; TW.set('mode', v); $('sec').scrollIntoView({ behavior: 'smooth' }); break;
    case 'cat': shown = 40; TW.set('cat', v); break;
    case 'top': $('hero').scrollIntoView({ behavior: 'smooth' }); break;
    case 'mark': {
      const id = b.dataset.id, k = b.dataset.k;
      const was = TW.mk(TW.who, id)[k], pairBefore = TW.wantBoth(id);
      if (k === 'been' && !was) slamKey = id;
      TW.toggle(id, k);
      if (k === 'want' && !pairBefore && TW.wantBoth(id)) { freshPair = id; render(); }
      break;
    }
  }
});
document.addEventListener('keydown', e => { const g = e.target.closest && e.target.closest('g[data-act]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
$('more').onclick = () => { shown += 40; render(); };
$('q').oninput = e => { shown = 40; TW.set('q', e.target.value.trim()); };
$('theme').onclick = () => TW.theme.toggle();
$('reset').onclick = () => TW.resetMarks();
$('fin').onclick = () => { window.scrollTo({ top: 0, behavior: 'smooth' }); setTimeout(runFinale, 350); };
new IntersectionObserver(([en]) => $('dock').classList.toggle('show', !en.isIntersecting && en.boundingClientRect.top < 0), { threshold: 0.12 }).observe($('hero'));
TW.onChange(render);
render();
</script>
</body>
</html>
