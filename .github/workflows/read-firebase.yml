name: read-firebase

on:
  workflow_dispatch:
    inputs:
      path:
        description: 要讀的路徑
        type: choice
        default: all
        options: [all, marks, inbox, places, removed]

permissions:
  contents: write

concurrency:
  group: firebase-io

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取 Firebase，存到 snapshot 分支的 live/
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
          INPUT_PATH: ${{ inputs.path }}
        run: |
          source scripts/fb-env.sh
          mkdir -p out/live
          if [ "$INPUT_PATH" = "all" ]; then url="$DB/.json"; else url="$DB/$INPUT_PATH.json"; fi
          curl -fsS --max-time 60 "$url?auth=$FIREBASE_SECRET" | jq -S . > "out/live/$INPUT_PATH.json"
          echo "已讀取 $INPUT_PATH（$(wc -c < "out/live/$INPUT_PATH.json") bytes）"
          bash scripts/snapshot-commit.sh out "read-firebase: $INPUT_PATH"
